<!DOCTYPE html>

<meta charset="UTF-8">

<style>

  [hidden] { display: none !important; }
  .nojs { background: #fff3cd; border: 1px solid #e0c36a; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
    color: #1b1f24;
    font-size: 17px;
    line-height: 1.4;
  }
  header {
    background: #1f3a5f;
    color: #fff;
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 { margin: 0; font-size: 19px; }
  #status { font-size: 14px; opacity: 0.92; min-height: 1em; margin-top: 4px; }
  main { max-width: 640px; margin: 0 auto; padding: 12px; }

  #menu { display: grid; gap: 10px; margin-bottom: 12px; }
  #menu button.scenario {
    text-align: left;
    padding: 14px 16px;
    font-size: 17px;
    border: 1px solid #c9d1db;
    border-radius: 12px;
    background: #fff;
    color: #1b1f24;
    cursor: pointer;
  }
  #menu button.scenario small { display: block; color: #5a6470; margin-top: 4px; font-size: 14px; }
  #menu button.random { background: #1f3a5f; color: #fff; border-color: #1f3a5f; text-align: center; }

  #chat { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .bubble { max-width: 92%; padding: 10px 12px; border-radius: 14px; overflow-wrap: anywhere; }
  .bubble p { margin: 0 0 6px 0; }
  .bubble .who { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: #5a6470; margin-bottom: 2px; }
  .bubble p.tr { color: #3c4650; font-style: italic; }
  .coach { background: #fff; border: 1px solid #d5dbe3; align-self: flex-start; }
  .student { background: #dff0e3; border: 1px solid #b9dcc2; align-self: flex-end; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  button.small, a.link {
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid #aab4c1;
    background: #f7f9fb;
    color: #1f3a5f;
    text-decoration: none;
    cursor: pointer;
    display: inline-block;
  }
  ul.notes { margin: 6px 0 8px 18px; padding: 0; font-size: 14px; color: #7a3b00; }
  ul.notes li { margin-bottom: 3px; }
  .endnote { align-self: center; font-size: 14px; color: #5a6470; text-align: center; padding: 4px 8px; }

  #inputArea { background: #fff; border: 1px solid #d5dbe3; border-radius: 12px; padding: 10px; margin-bottom: 12px; }
  textarea#answer {
    width: 100%;
    font-size: 17px;
    padding: 10px;
    border: 1px solid #c9d1db;
    border-radius: 8px;
    resize: vertical;
    font-family: inherit;
  }
  textarea#answer.live { border-color: #c0392b; box-shadow: 0 0 0 2px rgba(192, 57, 43, 0.15); }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row button {
    flex: 1;
    padding: 12px;
    font-size: 17px;
    border-radius: 10px;
    border: 1px solid #1f3a5f;
    background: #fff;
    color: #1f3a5f;
    cursor: pointer;
  }
  .row button.primary { background: #1f3a5f; color: #fff; }
  .row button.recording { background: #c0392b; border-color: #c0392b; color: #fff; }
  .row button:disabled { opacity: 0.5; }

  #tools { display: flex; gap: 8px; margin-bottom: 24px; }

    flex: 1;
    padding: 12px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid #aab4c1;
    background: #fff;
    color: #1b1f24;
    cursor: pointer;
  }
</style>
</head>

// =====================================================================
// GRAMMAR NOTES (Turkish), rule-based, no AI. Each rule: re, note.
// These catch common mistakes only; the learner's own AI app covers the rest.
// =====================================================================
const GRAMMAR = [
  { re: /\bI am agree\b/i, note: "'agree' fiili 'am' ile kullanılmaz. Doğrusu: 'I agree.'" },
  { re: /\bI is\b/i, note: "'I' ile 'am' kullanılır: 'I am'." },
  // 3rd person -s, but not after did/does/can/will/to etc. ("Did he go?" is correct)
  { re: /(?<!\b(?:did|does|do|didn't|doesn't|can|can't|could|will|won't|would|should|must|may|might|let|make|to)\s+)\b(?:he|she|it)\s+(?:go|have|do|play|make|take|get|want|say|see|come|move|touch|need)\b/i,
    note: "Üçüncü tekil şahısta (he/she/it) fiile -s eklenir: 'he goes', 'she has', 'it moves'." },
  { re: /\b(?:didn'?t|did not)\s+(?:saw|went|came|made|took|got|touched|moved|called|did)\b/i, note: "'didn't' sonrasında fiilin yalın hali gelir: 'didn't see', 'didn't touch', 'didn't move'." },
  { re: /\bmore (?:better|worse)\b/i, note: "'better' ve 'worse' zaten karşılaştırmadır. Başına 'more' gelmez." },
  { re: /\bhave (?:went|came|saw)\b/i, note: "'have' ile fiilin üçüncü hali kullanılır: 'have gone', 'have come', 'have seen'." },
  { re: /\bdiscuss about\b/i, note: "'discuss' edatsız kullanılır: 'discuss the call'." },
  { re: /\bon (?:arm|hand|body|shoulder|leg|side|hip|wrist|elbow)\b/i, note: "Vücut bölgesinden önce genelde 'the' ya da 'his' kullanılır: 'on the arm', 'on his arm'." },
  { re: /\bhe (?:don't|haven't)\b/i, note: "'he' ile 'doesn't' / 'hasn't' kullanılır: 'he doesn't', 'he hasn't'." },
  { re: /\bI (?:has|does not has|doesn't)\b/i, note: "'I' ile 'have' / 'don't' kullanılır: 'I have', 'I don't'." },
  // repeated word, except "that that" and "had had", which can be correct
  { re: /\b(?!that\b|had\b)(\w+)\s+\1\b/i, note: "Aynı kelime arka arkaya iki kez geçmiş olabilir." }
];

// =====================================================================
// Evaluation prompt that goes on top of the copied transcript
// =====================================================================
const EVAL_PROMPT =
`I am a Turkish speaker learning English at about A2-B1 level. I am a basketball referee.
Below is a practice conversation in English. The other person's lines are marked with their role. My lines are marked "Me".
For each of my lines, please:
1) point out grammar mistakes and show the corrected sentence,
2) say whether I answered the question clearly,
3) suggest a better, natural way to say it at my level,
4) give a score from 1 to 5 for grammar, clarity and relevance.
Explain everything in Turkish, with short English examples. At the end, give me 3 useful referee phrases to practise.`;

// =====================================================================
// State and helpers
// =====================================================================
let scenarioKey = null;
let nodeId = null;
let log = [];
let listening = false;
let sendAfterStop = false;

const $ = id => document.getElementById(id);
const menu = $("menu"), chat = $("chat"), inputArea = $("inputArea"),
      answer = $("answer"), micBtn = $("micBtn"), sendBtn = $("sendBtn"),
      tools = $("tools"), statusEl = $("status");

function setStatus(msg) { statusEl.textContent = msg; }
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

// Whole-word, case-insensitive. Apostrophes are normalised so "don't" and "don’t" match.
function matches(text, keys) {
  const t = text.replace(/[’‘]/g, "'");
  return keys.some(k => new RegExp("(^|[^\\w'])" + escapeRegex(k) + "(?=$|[^\\w'])", "i").test(t));
}

function grammarNotes(text) {
  const t = text.replace(/[’‘]/g, "'");
  return GRAMMAR.filter(g => g.re.test(t)).map(g => g.note);
}

let enVoice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const voices = speechSynthesis.getVoices();
  enVoice = voices.find(v => /^en[-_]US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  if (enVoice) u.voice = enVoice;
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

function smallBtn(label, fn) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "small";
  b.textContent = label;
  b.onclick = fn;
  return b;
}

function scrollToEnd() {
  const last = chat.lastElementChild;
  if (last) last.scrollIntoView({ behavior: "smooth", block: "end" });
}

function coachBubble(en, tr) {
  const d = document.createElement("div");
  d.className = "bubble coach";
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = SCENARIOS[scenarioKey].speaker;
  const p = document.createElement("p");
  p.textContent = en;
  const trP = document.createElement("p");
  trP.className = "tr";
  trP.textContent = tr;
  trP.hidden = true;
  const row = document.createElement("div");
  row.className = "btnrow";
  row.append(
    smallBtn("🔊 Tekrar dinle", () => speak(en)),
    smallBtn("Türkçe", () => { trP.hidden = !trP.hidden; })
  );
  d.append(who, p, trP, row);
  chat.appendChild(d);
  scrollToEnd();
  speak(en);
  log.push({ who: SCENARIOS[scenarioKey].speaker, text: en });
}

function studentBubble(text, notes) {
  const d = document.createElement("div");
  d.className = "bubble student";
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = "Sen";
  const p = document.createElement("p");
  p.textContent = text;
  d.append(who, p);
  if (notes.length) {
    const ul = document.createElement("ul");
    ul.className = "notes";
    notes.forEach(n => {
      const li = document.createElement("li");
      li.textContent = "✏️ " + n;
      ul.appendChild(li);
    });
    d.appendChild(ul);
  }
  const row = document.createElement("div");
  row.className = "btnrow";
  const a = document.createElement("a");
  a.className = "link";
  a.href = "https://translate.google.com/?sl=en&tl=tr&op=translate&text=" + encodeURIComponent(text);
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = "Türkçe'ye çevir";
  row.appendChild(a);
  d.appendChild(row);
  chat.appendChild(d);
  scrollToEnd();
  log.push({ who: "Me", text, notes });
}

function showNode(id) {
  nodeId = id;
  const node = SCENARIOS[scenarioKey].nodes[id];
  coachBubble(node.en, node.tr);
  if (node.end) {
    inputArea.hidden = true;
    const e = document.createElement("div");
    e.className = "endnote";
    e.textContent = "Konuşma bitti. “Konuşmayı kopyala” ile AI uygulamana yapıştır, sonra “Yeni konuşma” ile devam et.";
    chat.appendChild(e);
    scrollToEnd();
    setStatus("Konuşma bitti.");
  } else {
    setStatus("Cevabını konuş ya da yaz, sonra Gönder'e bas.");
  }
}

function startScenario(key) {
  stopListening(false);
  scenarioKey = key;
  log = [];
  chat.innerHTML = "";
  menu.hidden = true;
  inputArea.hidden = false;
  tools.hidden = false;
  answer.value = "";
  showNode(SCENARIOS[key].start);
}

function startRandom() {
  const keys = Object.keys(SCENARIOS).filter(k => k !== scenarioKey);
  const pool = keys.length ? keys : Object.keys(SCENARIOS);
  startScenario(pool[Math.floor(Math.random() * pool.length)]);
}

function showMenu() {
  stopListening(false);
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  scenarioKey = null;
  nodeId = null;
  log = [];
  chat.innerHTML = "";
  menu.innerHTML = "";
  menu.hidden = false;
  inputArea.hidden = true;
  tools.hidden = true;
  setStatus("Bir senaryo seç. / Choose a scenario.");

  const r = document.createElement("button");
  r.type = "button";
  r.className = "scenario random";
  r.textContent = "🎲 Rastgele senaryo";
  r.onclick = startRandom;
  menu.appendChild(r);

  Object.keys(SCENARIOS).forEach(key => {
    const s = SCENARIOS[key];
    const b = document.createElement("button");
    b.type = "button";
    b.className = "scenario";
    b.textContent = s.title;
    const small = document.createElement("small");
    small.textContent = s.subtitle;
    b.appendChild(small);
    b.onclick = () => startScenario(key);
    menu.appendChild(b);
  });
}

function send() {
  // If the mic is still on, stop it first and send when the final words arrive.
  if (listening) {
    sendAfterStop = true;
    recog.stop();
    return;
  }
  const text = answer.value.trim();
  if (!text || !scenarioKey) return;
  const node = SCENARIOS[scenarioKey].nodes[nodeId];
  if (node.end) return;

  studentBubble(text, grammarNotes(text));
  answer.value = "";

  const branch = (node.next || []).find(b => matches(text, b.keys));
  if (branch) {
    showNode(branch.to);
  } else {
    coachBubble(node.retry.en, node.retry.tr);
    setStatus("Tekrar dene. Türkçe ipucu için “Türkçe”ye bas.");
  }
}

// =====================================================================
// Speech recognition: live transcript into the answer box
// =====================================================================
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;

function setMicUi(on) {
  listening = on;
  micBtn.textContent = on ? "⏹ Durdur" : "🎤 Konuş";
  micBtn.classList.toggle("recording", on);
  answer.classList.toggle("live", on);
}

function stopListening(sendAfter) {
  sendAfterStop = sendAfter;
  if (recog && listening) recog.stop();
}

if (SR) {
  recog = new SR();
  recog.lang = "en-US";
  recog.interimResults = true;
  recog.continuous = false;
  recog.maxAlternatives = 1;

  recog.onresult = e => {
    let text = "";
    for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
    answer.value = text.trim();
  };
  recog.onend = () => {
    setMicUi(false);
    if (sendAfterStop) {
      sendAfterStop = false;
      send();
    }
  };
  recog.onerror = e => {
    setMicUi(false);
    sendAfterStop = false;
    const msg = {
      "not-allowed": "Mikrofon izni verilmedi. Tarayıcı ayarlarından izin ver ya da yazarak devam et.",
      "no-speech": "Ses duyulmadı. Tekrar dene ya da yaz.",
      "network": "Ses tanıma için internet gerekiyor. Yazarak devam edebilirsin.",
      "audio-capture": "Mikrofon bulunamadı. Yazarak devam edebilirsin."
    }[e.error] || "Ses tanıma çalışmadı. Yazarak devam edebilirsin.";
    setStatus(msg);
  };
} else {
  micBtn.disabled = true;
}

micBtn.onclick = () => {
  if (!recog) return;
  if (listening) { stopListening(false); return; }
  if ("speechSynthesis" in window) speechSynthesis.cancel(); // don't let the mic hear the coach
  answer.value = "";
  try {
    recog.start();
    setMicUi(true);
    setStatus("Dinliyorum... İngilizce konuş.");
  } catch (err) {
    setStatus("Mikrofon başlatılamadı. Yazarak devam edebilirsin.");
  }
};

sendBtn.onclick = send;
answer.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

// =====================================================================
// Copy transcript (with evaluation prompt) for the learner's own AI app
// =====================================================================
function transcriptText() {
  const lines = log.map(l => {
    const extra = l.notes && l.notes.length ? "   [app notes: " + l.notes.join(" | ") + "]" : "";
    return l.who + ": " + l.text + extra;
  });
  return EVAL_PROMPT + "\n\n--- Scenario: " + SCENARIOS[scenarioKey].title + " ---\n\n" + lines.join("\n");
}

async function copyTranscript() {
  if (!scenarioKey || !log.length) return;
  const t = transcriptText();
  let ok = false;
  try {
    await navigator.clipboard.writeText(t);
    ok = true;
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = t;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove();
  }
  setStatus(ok ? "Kopyalandı. AI uygulamana yapıştırabilirsin." : "Kopyalanamadı. Konuşmayı elle seçip kopyala.");
}

$("nojs").hidden = true; // the script is running, so hide the "open in a browser" warning
$("copyBtn").onclick = copyTranscript;
$("newBtn").onclick = showMenu;

if (!SR) {
  showMenu();
  setStatus("Bu tarayıcıda ses tanıma yok. Chrome kullan ya da yazarak devam et.");
} else {
  showMenu();
}
</script>
